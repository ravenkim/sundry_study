<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!--
    Fishbone 원인 및 효과 다이어그램 템플릿 (이시카와 지도/Ishikawa)
    사용: 근본 원인 분석、문제 진단、원인 및 결과 문제 해결
    적용 가능한 시나리오: 품질경영、고장 분석、6M분석 방법
    지원하다: 6가지가 있는 물고기 뼈 (추천하다4-6나뭇가지)
    -->

    <defs>
        <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="2" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="1280" height="720" fill="#FFFFFF"/>

    <!-- 제목 -->
    <text x="640" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="30" font-weight="700" fill="#1A252F">고객 이탈률의 근본 원인 분석</text>
    <text x="640" y="77" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" fill="#7F8C8D">Fishbone Diagram · 체계적 진단의 6가지 차원</text>

    <!-- 주요 척추 (횡선) -->
    <line x1="60" y1="380" x2="1120" y2="380" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>
    <!-- 물고기 머리 (직각삼각형+결과) -->
    <polygon points="1120,380 1180,340 1180,420" fill="#E74C3C"/>
    <rect x="1180" y="340" width="90" height="80" rx="6" fill="#E74C3C"/>
    <text x="1225" y="374" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="800" fill="#FFFFFF">고객</text>
    <text x="1225" y="396" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="800" fill="#FFFFFF">손실</text>

    <!-- ~ 위에3생선뼈 (대각선 위쪽) -->
    <!-- 뼈1: 제품 (x=240) -->
    <line x1="240" y1="380" x2="160" y2="160" stroke="#6C5CE7" stroke-width="2.5"/>
    <rect x="100" y="110" width="120" height="40" rx="20" fill="#6C5CE7" filter="url(#nodeShadow)"/>
    <text x="160" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">제품</text>
    <!-- 하위 요인 -->
    <line x1="212" y1="240" x2="160" y2="240" stroke="#6C5CE7" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="148" y="237" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">누락된 기능</text>
    <line x1="200" y1="290" x2="148" y2="290" stroke="#6C5CE7" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="136" y="287" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">불쌍한 경험</text>
    <line x1="223" y1="195" x2="171" y2="195" stroke="#6C5CE7" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="159" y="192" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">Bug너무 많이</text>

    <!-- 뼈2: 제공하다 (x=520) -->
    <line x1="520" y1="380" x2="440" y2="160" stroke="#00B894" stroke-width="2.5"/>
    <rect x="380" y="110" width="120" height="40" rx="20" fill="#00B894" filter="url(#nodeShadow)"/>
    <text x="440" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">제공하다</text>
    <line x1="492" y1="240" x2="440" y2="240" stroke="#00B894" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="428" y="237" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">느린 응답</text>
    <line x1="480" y1="290" x2="428" y2="290" stroke="#00B894" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="416" y="287" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">나쁜 태도</text>
    <line x1="503" y1="195" x2="451" y2="195" stroke="#00B894" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="439" y="192" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">과정이 번거롭네요</text>

    <!-- 뼈3: 가격 (x=800) -->
    <line x1="800" y1="380" x2="720" y2="160" stroke="#FDCB6E" stroke-width="2.5"/>
    <rect x="660" y="110" width="120" height="40" rx="20" fill="#D4A537" filter="url(#nodeShadow)"/>
    <text x="720" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">가격</text>
    <line x1="772" y1="240" x2="720" y2="240" stroke="#D4A537" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="708" y="237" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">저비용 성능</text>
    <line x1="760" y1="290" x2="708" y2="290" stroke="#D4A537" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="696" y="287" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">빈번한 가격 인상</text>
    <line x1="783" y1="195" x2="731" y2="195" stroke="#D4A537" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="719" y="192" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">숨겨진 비용</text>

    <!-- 아래에3생선뼈 (대각선 아래로) -->
    <!-- 뼈4: 경쟁 제품 (x=240) -->
    <line x1="240" y1="380" x2="160" y2="600" stroke="#0984E3" stroke-width="2.5"/>
    <rect x="100" y="600" width="120" height="40" rx="20" fill="#0984E3" filter="url(#nodeShadow)"/>
    <text x="160" y="626" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">경쟁 제품</text>
    <line x1="212" y1="520" x2="160" y2="520" stroke="#0984E3" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="148" y="517" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">상대는 빠르게 혁신합니다</text>
    <line x1="200" y1="470" x2="148" y2="470" stroke="#0984E3" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="136" y="467" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">저렴한 스위칭 비용</text>
    <line x1="223" y1="565" x2="171" y2="565" stroke="#0984E3" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="159" y="562" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">가격 전쟁</text>

    <!-- 뼈5: 운영 (x=520) -->
    <line x1="520" y1="380" x2="440" y2="600" stroke="#E17055" stroke-width="2.5"/>
    <rect x="380" y="600" width="120" height="40" rx="20" fill="#E17055" filter="url(#nodeShadow)"/>
    <text x="440" y="626" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">운영</text>
    <line x1="492" y1="520" x2="440" y2="520" stroke="#E17055" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="428" y="517" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">도달범위가 충분하지 않음</text>
    <line x1="480" y1="470" x2="428" y2="470" stroke="#E17055" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="416" y="467" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">조기 경고 누락</text>
    <line x1="503" y1="565" x2="451" y2="565" stroke="#E17055" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="439" y="562" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">미흡한 갱신 안내</text>

    <!-- 뼈6: 입소문 (x=800) -->
    <line x1="800" y1="380" x2="720" y2="600" stroke="#A29BFE" stroke-width="2.5"/>
    <rect x="660" y="600" width="120" height="40" rx="20" fill="#A29BFE" filter="url(#nodeShadow)"/>
    <text x="720" y="626" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">입소문</text>
    <line x1="772" y1="520" x2="720" y2="520" stroke="#A29BFE" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="708" y="517" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">부정적인 후기 더 보기</text>
    <line x1="760" y1="470" x2="708" y2="470" stroke="#A29BFE" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="696" y="467" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">제대로 유지되지 않은 커뮤니티</text>
    <line x1="783" y1="565" x2="731" y2="565" stroke="#A29BFE" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="719" y="562" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">적은 성공 사례</text>

    <!-- 하단 음표 -->
    <text x="640" y="690" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#BDC3C7">생선뼈 다이어그램（이시카와 지도）: 다양한 차원의 문제의 근본 원인을 체계적으로 정리</text>
</svg>