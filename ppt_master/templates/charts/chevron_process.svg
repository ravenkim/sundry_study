<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!--
    화살표 체인 프로세스 템플릿 (Chevron Process)
    사용: 선형 스테이지 프로세스、단계별、방법론 데모、전체 블록 단계 화살표 참조
    적용 가능한 시나리오: 판매 유입경로 단계、프로젝트 단계、방법적 단계
    지원하다: 5스테이지 가로 화살표 (추천하다3-6)
    제안 재사용:
      - 페이지가 필요할 때“두꺼운 화살 전체 블록”표현 단계가 진행됨에 따라，이 템플릿에서 참조 우선 순위 지정 polygon 화살표 구조
      - 사용하지 마세요 marker-end 이 유형의 와이드 화살표 본문 화살표 시뮬레이션

    재사용 가능한 조각 1: 오각형 chevron（무대 화살표）
      <polygon points="40,0 220,0 260,48 220,96 40,96 80,48"
               fill="#6C5CE7"/>

    재사용 가능한 조각 2: 긴 화살표가 있는 머리 block arrow（결론은 다음을 가리킨다.）
      <path d="M60,10 H300 V-36 L470,80 L300,196 V150 H60 Z"
            fill="#5D96E4" stroke="#3F76C8" stroke-width="4"/>
    -->

    <defs>
        <filter id="chevronShadow" x="-10%" y="-20%" width="120%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="2" dy="3" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="2" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="1280" height="720" fill="#FFFFFF"/>

    <!-- 제목 -->
    <text x="640" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="30" font-weight="700" fill="#1A252F">디지털 트랜스포메이션 방법론</text>
    <text x="640" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" fill="#7F8C8D">Chevron Process · 5단계 진보적 발전 프레임워크</text>

    <!-- 화살1 (맨 왼쪽) -->
    <polygon points="40,220 200,220 230,265 200,310 40,310" fill="#6C5CE7" filter="url(#chevronShadow)"/>
    <text x="130" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">진단 평가</text>
    <text x="130" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" fill="#FFFFFF" fill-opacity="0.8">PHASE 01</text>

    <!-- 화살2 -->
    <polygon points="235,220 400,220 430,265 400,310 235,310 265,265" fill="#A29BFE" filter="url(#chevronShadow)"/>
    <text x="330" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">기획 및 디자인</text>
    <text x="330" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" fill="#FFFFFF" fill-opacity="0.8">PHASE 02</text>

    <!-- 화살3 -->
    <polygon points="435,220 610,220 640,265 610,310 435,310 465,265" fill="#0984E3" filter="url(#chevronShadow)"/>
    <text x="533" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">파일럿 검증</text>
    <text x="533" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" fill="#FFFFFF" fill-opacity="0.8">PHASE 03</text>

    <!-- 화살4 -->
    <polygon points="645,220 830,220 860,265 830,310 645,310 675,265" fill="#00B894" filter="url(#chevronShadow)"/>
    <text x="748" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">규모 프로모션</text>
    <text x="748" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" fill="#FFFFFF" fill-opacity="0.8">PHASE 04</text>

    <!-- 화살5 -->
    <polygon points="865,220 1060,220 1090,265 1060,310 865,310 895,265" fill="#E17055" filter="url(#chevronShadow)"/>
    <text x="973" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">지속적인 최적화</text>
    <text x="973" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" fill="#FFFFFF" fill-opacity="0.8">PHASE 05</text>

    <!-- 스테이지 지속 시간 표시줄 -->
    <rect x="40" y="325" width="190" height="20" rx="4" fill="#6C5CE7" fill-opacity="0.15"/>
    <text x="135" y="339" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" font-weight="600" fill="#6C5CE7">2-4주</text>
    <rect x="245" y="325" width="195" height="20" rx="4" fill="#A29BFE" fill-opacity="0.15"/>
    <text x="342" y="339" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" font-weight="600" fill="#A29BFE">4-6주</text>
    <rect x="450" y="325" width="195" height="20" rx="4" fill="#0984E3" fill-opacity="0.15"/>
    <text x="547" y="339" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" font-weight="600" fill="#0984E3">8-12주</text>
    <rect x="655" y="325" width="210" height="20" rx="4" fill="#00B894" fill-opacity="0.15"/>
    <text x="760" y="339" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" font-weight="600" fill="#00B894">12-16주</text>
    <rect x="875" y="325" width="215" height="20" rx="4" fill="#E17055" fill-opacity="0.15"/>
    <text x="982" y="339" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" font-weight="600" fill="#E17055">계속되는</text>

    <!-- 세부 정보 카드 라인 -->
    <!-- 카드1 -->
    <g filter="url(#cardShadow)">
        <rect x="40" y="370" width="190" height="290" rx="10" fill="#FFFFFF"/>
        <rect x="40" y="370" width="190" height="5" rx="3" fill="#6C5CE7"/>
        <text x="135" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="15" font-weight="700" fill="#1A252F">진단 평가</text>
        <line x1="65" y1="420" x2="205" y2="420" stroke="#F0F0F0" stroke-width="1"/>
        <text x="60" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 상태 역량 평가</text>
        <text x="60" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 문제점 식별</text>
        <text x="60" y="491" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 성숙도 평가</text>
        <text x="60" y="514" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 목표 격차 분석</text>
        <line x1="65" y1="535" x2="205" y2="535" stroke="#F0F0F0" stroke-width="1"/>
        <text x="60" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#6C5CE7">결과물:</text>
        <text x="60" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#95A5A6">진단 보고서</text>
        <text x="60" y="598" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#95A5A6">능력 성숙도 스코어카드</text>
    </g>

    <!-- 카드2 -->
    <g filter="url(#cardShadow)">
        <rect x="250" y="370" width="190" height="290" rx="10" fill="#FFFFFF"/>
        <rect x="250" y="370" width="190" height="5" rx="3" fill="#A29BFE"/>
        <text x="345" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="15" font-weight="700" fill="#1A252F">기획 및 디자인</text>
        <line x1="275" y1="420" x2="415" y2="420" stroke="#F0F0F0" stroke-width="1"/>
        <text x="270" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 최상위 건축 설계</text>
        <text x="270" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 기술 선택 평가</text>
        <text x="270" y="491" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 로드맵 준비</text>
        <text x="270" y="514" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 투자 수익률 측정</text>
        <line x1="275" y1="535" x2="415" y2="535" stroke="#F0F0F0" stroke-width="1"/>
        <text x="270" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#A29BFE">결과물:</text>
        <text x="270" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#95A5A6">변환 청사진</text>
        <text x="270" y="598" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#95A5A6">ROI분석 보고서</text>
    </g>

    <!-- 카드3 -->
    <g filter="url(#cardShadow)">
        <rect x="460" y="370" width="190" height="290" rx="10" fill="#FFFFFF"/>
        <rect x="460" y="370" width="190" height="5" rx="3" fill="#0984E3"/>
        <text x="555" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="15" font-weight="700" fill="#1A252F">파일럿 검증</text>
        <line x1="485" y1="420" x2="625" y2="420" stroke="#F0F0F0" stroke-width="1"/>
        <text x="480" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 선택된 파일럿 시나리오</text>
        <text x="480" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· MVP빠르게 시작하고 실행하세요</text>
        <text x="480" y="491" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 효과 데이터 수집</text>
        <text x="480" y="514" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 사용자 피드백 반복</text>
        <line x1="485" y1="535" x2="625" y2="535" stroke="#F0F0F0" stroke-width="1"/>
        <text x="480" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#0984E3">결과물:</text>
        <text x="480" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#95A5A6">파일럿 요약 보고서</text>
        <text x="480" y="598" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#95A5A6">출시 타당성 평가</text>
    </g>

    <!-- 카드4 -->
    <g filter="url(#cardShadow)">
        <rect x="670" y="370" width="190" height="290" rx="10" fill="#FFFFFF"/>
        <rect x="670" y="370" width="190" height="5" rx="3" fill="#00B894"/>
        <text x="765" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="15" font-weight="700" fill="#1A252F">규모 프로모션</text>
        <line x1="695" y1="420" x2="835" y2="420" stroke="#F0F0F0" stroke-width="1"/>
        <text x="690" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 전체 비즈니스 프로모션 라인</text>
        <text x="690" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 조직 변화 패키지</text>
        <text x="690" y="491" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 교육 역량 강화 프로그램</text>
        <text x="690" y="514" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 표준화된 프로세스 구성</text>
        <line x1="695" y1="535" x2="835" y2="535" stroke="#F0F0F0" stroke-width="1"/>
        <text x="690" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#00B894">결과물:</text>
        <text x="690" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#95A5A6">추진실행계획</text>
        <text x="690" y="598" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#95A5A6">조직 역량 강화 핸드북</text>
    </g>

    <!-- 카드5 -->
    <g filter="url(#cardShadow)">
        <rect x="880" y="370" width="190" height="290" rx="10" fill="#FFFFFF"/>
        <rect x="880" y="370" width="190" height="5" rx="3" fill="#E17055"/>
        <text x="975" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="15" font-weight="700" fill="#1A252F">지속적인 최적화</text>
        <line x1="905" y1="420" x2="1045" y2="420" stroke="#F0F0F0" stroke-width="1"/>
        <text x="900" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 운영 효율성 모니터링</text>
        <text x="900" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 데이터 기반 최적화</text>
        <text x="900" y="491" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 기술 반복 업그레이드</text>
        <text x="900" y="514" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F6368">· 새 시나리오 확장</text>
        <line x1="905" y1="535" x2="1045" y2="535" stroke="#F0F0F0" stroke-width="1"/>
        <text x="900" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E17055">결과물:</text>
        <text x="900" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#95A5A6">칸반 운영</text>
        <text x="900" y="598" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#95A5A6">분기별 최적화 보고서</text>
    </g>

    <!-- 하단 음표 -->
    <text x="640" y="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#BDC3C7">각 단계에서 기업의 실제 상황에 따라 시간과 결과물을 조정할 수 있는 유연성</text>
</svg>
