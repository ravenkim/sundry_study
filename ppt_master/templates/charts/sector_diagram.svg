<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!--
    섹터 방사선 사진 템플릿
    사용: 중앙 테마 방사선、반원 분포、서비스 시스템 디스플레이
    적용 가능한 시나리오: 핵심 능력 방사선、서비스 매트릭스、생태계
    지원하다: 6섹터 반원 (추천하다4-8개인)
    -->

    <defs>
        <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="2" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="1280" height="720" fill="#FFFFFF"/>

    <!-- 제목 -->
    <text x="640" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="30" font-weight="700" fill="#1A252F">엔터프라이즈 서비스 생태계</text>
    <text x="640" y="77" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" fill="#7F8C8D">Service Ecosystem · 센터 플랫폼을 둘러싼 6가지 핵심 서비스 역량</text>

    <!-- 반원형 베이스 보조 -->
    <path d="M 190,580 A 450,450 0 0,1 1090,580" fill="none" stroke="#E8E8E8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <path d="M 310,580 A 330,330 0 0,1 970,580" fill="none" stroke="#E8E8E8" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- 연결선 (중앙에서 노드까지) -->
    <!-- 센터(640,540) -->
    <line x1="640" y1="490" x2="640" y2="160" stroke="#6C5CE7" stroke-width="2" stroke-opacity="0.25"/>
    <line x1="610" y1="495" x2="290" y2="220" stroke="#00B894" stroke-width="2" stroke-opacity="0.25"/>
    <line x1="670" y1="495" x2="990" y2="220" stroke="#E17055" stroke-width="2" stroke-opacity="0.25"/>
    <line x1="590" y1="510" x2="170" y2="420" stroke="#74B9FF" stroke-width="2" stroke-opacity="0.25"/>
    <line x1="690" y1="510" x2="1110" y2="420" stroke="#FDCB6E" stroke-width="2" stroke-opacity="0.25"/>
    <line x1="580" y1="530" x2="240" y2="580" stroke="#A29BFE" stroke-width="2" stroke-opacity="0.25"/>

    <!-- 중앙 노드 -->
    <circle cx="640" cy="540" r="55" fill="#2C3E50" filter="url(#nodeShadow)"/>
    <text x="640" y="533" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" font-weight="800" fill="#FFFFFF">핵심</text>
    <text x="640" y="555" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" font-weight="800" fill="#FFFFFF">플랫폼</text>

    <!-- 마디1 (상단 바로 위) -->
    <circle cx="640" cy="145" r="42" fill="#6C5CE7" filter="url(#nodeShadow)"/>
    <text x="640" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">데이터</text>
    <text x="640" y="158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">지능적인</text>
    <rect x="560" y="198" width="160" height="48" rx="8" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <text x="640" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">AI분석 엔진</text>
    <text x="640" y="237" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="11" fill="#95A5A6">실시간 데이터 인사이트 및 예측</text>

    <!-- 마디2 (왼쪽 위) -->
    <circle cx="290" cy="210" r="42" fill="#00B894" filter="url(#nodeShadow)"/>
    <text x="290" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">기술</text>
    <text x="290" y="223" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">연구개발</text>
    <rect x="210" y="263" width="160" height="48" rx="8" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <text x="290" y="285" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">전체 스택 기술 역량</text>
    <text x="290" y="302" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="11" fill="#95A5A6">클라우드 네이티브+마이크로서비스 아키텍처</text>

    <!-- 마디3 (오른쪽 위) -->
    <circle cx="990" cy="210" r="42" fill="#E17055" filter="url(#nodeShadow)"/>
    <text x="990" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">고객</text>
    <text x="990" y="223" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">성공</text>
    <rect x="910" y="263" width="160" height="48" rx="8" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <text x="990" y="285" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">전담 계정 관리자</text>
    <text x="990" y="302" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="11" fill="#95A5A6">7×24시간별 응답 보장</text>

    <!-- 마디4 (왼쪽 가운데) -->
    <circle cx="165" cy="410" r="42" fill="#74B9FF" filter="url(#nodeShadow)"/>
    <text x="165" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">안전</text>
    <text x="165" y="423" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">규정 준수</text>
    <rect x="85" y="463" width="160" height="48" rx="8" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <text x="165" y="485" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">III 등급 인증</text>
    <text x="165" y="502" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="11" fill="#95A5A6">SOC2/GDPR/ISO27001</text>

    <!-- 마디5 (오른쪽 가운데) -->
    <circle cx="1115" cy="410" r="42" fill="#D4A537" filter="url(#nodeShadow)"/>
    <text x="1115" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">생태학</text>
    <text x="1115" y="423" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">통합</text>
    <rect x="1035" y="463" width="160" height="48" rx="8" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <text x="1115" y="485" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">200+ API인터페이스</text>
    <text x="1115" y="502" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="11" fill="#95A5A6">메인스트림 시스템의 원활한 도킹</text>

    <!-- 마디6 (왼쪽 아래) -->
    <circle cx="240" cy="575" r="42" fill="#A29BFE" filter="url(#nodeShadow)"/>
    <text x="240" y="570" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">훈련</text>
    <text x="240" y="588" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">권한 부여</text>
    <rect x="160" y="625" width="160" height="48" rx="8" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <text x="240" y="647" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#5F6368">온라인 및 대면 교육</text>
    <text x="240" y="664" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="11" fill="#95A5A6">인증 시스템 및 기술 자료</text>
</svg>