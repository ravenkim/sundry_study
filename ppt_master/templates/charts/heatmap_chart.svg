<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!-- 
    히트맵 템플릿
    사용: 매트릭스 데이터 시각화、상관분석
    적용 가능한 시나리오: 상관 관계 매트릭스、시간 히트맵、사용자 행동 분석
    지원하다: 7×7 매트릭스 격자
    -->
    
    <defs>
        <!-- 히트맵 색상 스케일（파란색에서 빨간색으로） -->
        <linearGradient id="heatGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#1565C0"/>
            <stop offset="25%" style="stop-color:#42A5F5"/>
            <stop offset="50%" style="stop-color:#FFEB3B"/>
            <stop offset="75%" style="stop-color:#FF9800"/>
            <stop offset="100%" style="stop-color:#D32F2F"/>
        </linearGradient>
    </defs>
    
    <!-- 배경 -->
    <rect width="1280" height="720" fill="#FFFFFF"/>
    
    <!-- 제목 -->
    <text x="60" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Malgun Gothic', sans-serif" 
          font-size="32" font-weight="bold" fill="#2C3E50">
        <tspan>사용자 활동 히트맵</tspan>
    </text>
    
    <text x="60" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Malgun Gothic', sans-serif" 
          font-size="18" fill="#7F8C8D">
        <tspan>요일 및 시간대별 통계 · 값은 평균 온라인 사용자 수를 나타냅니다（수천명의 사람들）</tspan>
    </text>
    
    <!-- 히트맵 영역 -->
    <g id="heatmapArea" transform="translate(180, 130)">
        <!-- 
        그리드 크기: 80×60
        목록: 7목록（월요일 ~ 일요일）
        좋아요: 8좋아요（기간）
        컬러 맵: 0-100 -> 파란색에서 빨간색으로
        -->
        
        <!-- 열 헤더（주） -->
        <text x="40" y="-15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Malgun Gothic', sans-serif" 
              font-size="14" font-weight="600" fill="#5D6D7E" text-anchor="middle"><tspan>월요일에</tspan></text>
        <text x="120" y="-15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Malgun Gothic', sans-serif" 
