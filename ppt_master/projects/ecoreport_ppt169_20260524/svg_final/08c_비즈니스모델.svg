  <text x="60" y="119" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">1</text>
  <text x="92" y="108" font-family="Pretendard, system-ui, sans-serif" font-size="17" font-weight="700" fill="#2E7D32">SaaS 구독 (학교)</text>
  <text x="92" y="126" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#9AA0A6">B2B · 대학 시설팀 대상</text>

  <line x1="44" y1="140" x2="382" y2="140" stroke="#E8EAED" stroke-width="1" />

  <text x="44" y="162" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 대학교 1곳당 월 30~50만원</text>
  <text x="44" y="182" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 강의실 수에 따라 티어 책정</text>
  <text x="44" y="202" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">  Tier1: ~200강의실 / 30만원</text>
  <text x="44" y="222" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">  Tier2: ~500강의실 / 50만원</text>
  <text x="44" y="242" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">  Enterprise: 협의</text>

  <line x1="44" y1="256" x2="382" y2="256" stroke="#E8EAED" stroke-width="1" stroke-dasharray="3,2" />
  <text x="44" y="274" font-family="Pretendard, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2E7D32">ROI 제안</text>
  <text x="44" y="294" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">월 절약 전기료 10만원 이상</text>
  <text x="44" y="314" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">→ 구독료 상쇄 후 순 이익</text>
  <text x="44" y="334" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#9AA0A6">탄소중립 ESG 실적 제공</text>

  <path fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1" d="M54,354 H372 A10,10 0 0 1 382,364 V398 A10,10 0 0 1 372,408 H54 A10,10 0 0 1 44,398 V364 A10,10 0 0 1 54,354 Z" />
  <text x="213" y="378" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="14" font-weight="700" fill="#2E7D32">430개 대학 × 40만 = 월 1.7억</text>
  <text x="213" y="396" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="12" fill="#5F6368">10% 침투율 = 월 1,720만원 ARR</text>

  <text x="213" y="462" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" font-weight="600" fill="#9AA0A6">주요 수익원 ★★★★★</text>

  
