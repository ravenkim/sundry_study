  <text x="856" y="119" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">3</text>
  <text x="888" y="108" font-family="Pretendard, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1565C0">에너지 데이터 서비스</text>
  <text x="888" y="126" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#9AA0A6">B2B API · 연구기관</text>

  <line x1="840" y1="140" x2="1236" y2="140" stroke="#E8EAED" stroke-width="1" />

  <text x="840" y="162" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 캠퍼스 에너지 낭비 패턴 데이터</text>
  <text x="840" y="182" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 장소별·시간대별·설비별 통계 API</text>
  <text x="840" y="202" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 에너지 절감 컨설팅 기관 판매</text>
  <text x="840" y="222" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 스마트빌딩 솔루션사 OEM 공급</text>

  <line x1="840" y1="236" x2="1236" y2="236" stroke="#E8EAED" stroke-width="1" stroke-dasharray="3,2" />
  <text x="840" y="254" font-family="Pretendard, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1565C0">잠재 고객</text>
  <text x="840" y="274" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 에너지관리공단(KEA)</text>
  <text x="840" y="294" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 탄소배출권 거래 플랫폼</text>
  <text x="840" y="314" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 건물 에너지 관리 스타트업</text>

  <path fill="#E3F2FD" stroke="#90CAF9" stroke-width="1" d="M850,334 H1206 A10,10 0 0 1 1216,344 V378 A10,10 0 0 1 1206,388 H850 A10,10 0 0 1 840,378 V344 A10,10 0 0 1 850,334 Z" />
  <text x="1028" y="358" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1565C0">Phase 2 수익원 (PMF 후)</text>
  <text x="1028" y="376" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="12" fill="#5F6368">데이터 자산 가치는 참여자 증가와 정비례</text>

  <text x="1028" y="462" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" font-weight="600" fill="#9AA0A6">미래 수익원 ★★★★☆</text>

  
  <path fill="#1A237E" d="M36,496 H1244 A12,12 0 0 1 1256,508 V564 A12,12 0 0 1 1244,576 H36 A12,12 0 0 1 24,564 V508 A12,12 0 0 1 36,496 Z" />
  <text x="640" y="524" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">현 단계: SaaS 구독 + 포인트 재원 모델로 시작 → PMF 이후 데이터 사업 확장</text>
  <text x="640" y="550" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="14" fill="#9AA0A6">MVP 목표: 3개 대학 파일럿 → 6개월 내 손익분기점 · 구독료 = 운영비 + AI API 비용</text>
  <text x="640" y="568" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#4CAF50">도입 장벽: 설비 투자 없음 · API 키 1개만 공유하면 즉시 시작 가능</text>

  
  <path fill="#F8F9FA" stroke="#E8EAED" stroke-width="1" d="M36,590 H1244 A12,12 0 0 1 1256,602 V658 A12,12 0 0 1 1244,670 H36 A12,12 0 0 1 24,658 V602 A12,12 0 0 1 36,590 Z" />
  <text x="640" y="618" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1A237E">수익 실현 전제 조건</text>
  <text x="640" y="640" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">① 포인트 교환 시스템 완성 (Phase 1) · ② GCS 이미지 영구 저장 · ③ 관리자 리포트 API 완성 · ④ 3개 파일럿 캠퍼스 확보</text>
  <text x="640" y="658" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="12" fill="#9AA0A6">현재 핵심 기능 완료 — 상용화까지 4~6주 추가 개발 필요 추정</text>

  <text x="1240" y="706" text-anchor="end" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#9AA0A6">08c / 30</text>
