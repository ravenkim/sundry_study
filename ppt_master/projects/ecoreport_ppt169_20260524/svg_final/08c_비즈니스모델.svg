  <text x="490" y="108" font-family="Pretendard, system-ui, sans-serif" font-size="17" font-weight="700" fill="#E65100">포인트 리워드 수수료</text>
  <text x="490" y="126" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#9AA0A6">교환 상품 마진</text>

  <line x1="442" y1="140" x2="780" y2="140" stroke="#E8EAED" stroke-width="1" />

  <text x="442" y="162" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 기프티콘 도매 구매 → 정가 교환</text>
  <text x="442" y="182" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 10~15% 마진 수익</text>
  <text x="442" y="202" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 쿠폰사 파트너십 (카카오, GS25 등)</text>

  <line x1="442" y1="216" x2="780" y2="216" stroke="#E8EAED" stroke-width="1" stroke-dasharray="3,2" />
  <text x="442" y="234" font-family="Pretendard, system-ui, sans-serif" font-size="13" font-weight="600" fill="#E65100">포인트 재원 흐름</text>
  <text x="442" y="254" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">절약 전기료 일부 → 학교가 포인트 예산 책정</text>
  <text x="442" y="274" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">→ EcoReport 플랫폼을 통해 학생에게 지급</text>
  <text x="442" y="294" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#9AA0A6">절약 10만 중 2~3만원 포인트 재원 사용</text>
  <text x="442" y="314" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#9AA0A6">학교 입장: 순 절약 7~8만원/월 실현</text>

  <path fill="#FFF8E1" stroke="#FFD54F" stroke-width="1" d="M452,334 H770 A10,10 0 0 1 780,344 V378 A10,10 0 0 1 770,388 H452 A10,10 0 0 1 442,378 V344 A10,10 0 0 1 452,334 Z" />
  <text x="611" y="358" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="14" font-weight="700" fill="#E65100">학교·학생·플랫폼 3자 Win-Win</text>
  <text x="611" y="376" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="12" fill="#5F6368">선순환 구조 — 참여 증가 = 수익 증가</text>

  <text x="611" y="462" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" font-weight="600" fill="#9AA0A6">보조 수익원 ★★★☆☆</text>

  
