  <text x="474" y="450" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="11" fill="#5F6368">소속 · 학교 · 학과 선택</text>

  <!-- Screen 3: 홈 -->
  <rect x="634" y="82" width="295" height="330" rx="12" fill="#1A1A2E" stroke="#FFC107" stroke-width="2"/>
  <rect x="634" y="82" width="295" height="6" rx="3" fill="#FFC107"/>
  <image href="../images/screen_home.png" x="634" y="88" width="295" height="324" preserveAspectRatio="xMidYMid slice"/>
