  <rect x="40" y="58" width="180" height="3" rx="2" fill="#FFC107"/>
  <text x="40" y="76" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" fill="#9AA0A6">React 19 · TailwindCSS v4 · shadcn/ui — 실제 구현 화면 (390×844 모바일)</text>

  <!-- ============ Row 1: 4 screens (y=82 ~ y=430) ============ -->
  <!-- 프레임 높이 330, 너비 295 (= 0.46 × 640 ≈ 포트레이트 비율) -->
  <!-- x: 20 | 327 | 634 | 941  →  각 295px, gap 12px -->

  <!-- Screen 1: 로그인 -->
  <rect x="20" y="82" width="295" height="330" rx="12" fill="#1A1A2E" stroke="#4285F4" stroke-width="2"/>
  <rect x="20" y="82" width="295" height="6" rx="3" fill="#4285F4"/>
  <image href="../images/screen_login.png" x="20" y="88" width="295" height="324" preserveAspectRatio="xMidYMid slice"/>
  <rect x="20" y="418" width="295" height="38" rx="8" fill="#E3F2FD"/>
  <text x="167" y="434" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" font-weight="700" fill="#1565C0">로그인</text>
  <text x="167" y="450" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="11" fill="#5F6368">이메일 / 구글 OAuth2</text>

  <!-- Screen 2: 회원가입 -->
  <rect x="327" y="82" width="295" height="330" rx="12" fill="#1A1A2E" stroke="#4CAF50" stroke-width="2"/>
  <rect x="327" y="82" width="295" height="6" rx="3" fill="#4CAF50"/>
  <image href="../images/screen_signup.png" x="327" y="88" width="295" height="324" preserveAspectRatio="xMidYMid slice"/>
  <rect x="327" y="418" width="295" height="38" rx="8" fill="#E8F5E9"/>
  <text x="474" y="434" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
