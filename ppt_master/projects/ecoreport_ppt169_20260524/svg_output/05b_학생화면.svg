  <!-- Screen 6: 포인트 샵 -->
  <rect x="445" y="466" width="390" height="220" rx="12" fill="#1A1A2E" stroke="#FFC107" stroke-width="2"/>
  <rect x="445" y="466" width="390" height="6" rx="3" fill="#FFC107"/>
  <image href="../images/screen_shop.png" x="445" y="472" width="390" height="214" preserveAspectRatio="xMidYMid slice"/>
  <rect x="445" y="688" width="390" height="26" rx="6" fill="#FFF8E1"/>
  <text x="640" y="706" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" font-weight="700" fill="#E65100">포인트 샵 — 기프티콘 교환</text>

  <!-- Screen 7: 제보 목록 -->
  <rect x="855" y="466" width="390" height="220" rx="12" fill="#1A1A2E" stroke="#4285F4" stroke-width="2"/>
  <rect x="855" y="466" width="390" height="6" rx="3" fill="#4285F4"/>
  <image href="../images/screen_reports.png" x="855" y="472" width="390" height="214" preserveAspectRatio="xMidYMid slice"/>
  <rect x="855" y="688" width="390" height="26" rx="6" fill="#E3F2FD"/>
  <text x="1050" y="706" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
