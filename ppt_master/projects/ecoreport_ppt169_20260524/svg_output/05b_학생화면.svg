  <!-- ============ Row 2: 3 screens (y=466 ~ y=692) ============ -->
  <!-- 너비 390, gap 20, x: 95 | 505 | 795  centred in 1280 -->
  <!-- total: 3×390 + 2×20 = 1210; margin: (1280-1210)/2 = 35 -->

  <!-- Screen 5: 제보 성공 -->
  <rect x="35" y="466" width="390" height="220" rx="12" fill="#1A1A2E" stroke="#4CAF50" stroke-width="2"/>
  <rect x="35" y="466" width="390" height="6" rx="3" fill="#4CAF50"/>
  <image href="../images/screen_report_success.png" x="35" y="472" width="390" height="214" preserveAspectRatio="xMidYMid slice"/>
  <rect x="35" y="688" width="390" height="26" rx="6" fill="#E8F5E9"/>
  <text x="230" y="706" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
