  <!-- 처리 -->
  <text x="44" y="254" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" font-weight="600" fill="#1565C0">처리 방식</text>
  <rect x="44" y="262" width="316" height="84" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1"/>
  <text x="60" y="282" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" fill="#5F6368">• YOLO bbox 탐지 → 조명 영역 추출</text>
  <text x="60" y="302" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" fill="#5F6368">• confidence ≥ 0.5 조명 ON 판정</text>
  <text x="60" y="322" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" fill="#5F6368">• 탐지된 조명 수 카운트</text>

  <!-- 출력 -->
  <text x="44" y="362" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" font-weight="600" fill="#1565C0">출력</text>
  <rect x="44" y="370" width="152" height="52" rx="8" fill="#4285F4" fill-opacity="0.15" stroke="#4285F4" stroke-width="1"/>
  <text x="120" y="392" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" font-weight="700" fill="#1565C0">light_on: true</text>
  <text x="120" y="410" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">light_count: N</text>
  <rect x="208" y="370" width="152" height="52" rx="8" fill="#9AA0A6" fill-opacity="0.1" stroke="#9AA0A6" stroke-width="1"/>
  <text x="284" y="392" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" font-weight="700" fill="#5F6368">light_on: false</text>
  <text x="284" y="410" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#9AA0A6">→ 낭비 없음</text>

