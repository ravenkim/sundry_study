  <rect x="464" y="516" width="316" height="112" rx="8" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1"/>
  <text x="480" y="536" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" font-weight="600" fill="#2E7D32">소비전력 추정 공식</text>
  <text x="480" y="554" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">에어컨 1대: ~1,500W (냉방 기준)</text>
  <text x="480" y="572" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">조명 1세트: ~80W (형광등 40W×2)</text>
  <text x="480" y="590" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" font-weight="600" fill="#2E7D32">Step 1+2 결합</text>
  <text x="480" y="608" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">total_waste_kw = light×0.08 + ac×1.5</text>
  <text x="480" y="624" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">→ Gemini에 전달</text>

  <!-- 화살표 2→3 -->
  <line x1="813" y1="376" x2="857" y2="376" stroke="#5F6368" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#s04b_arrow)"/>

