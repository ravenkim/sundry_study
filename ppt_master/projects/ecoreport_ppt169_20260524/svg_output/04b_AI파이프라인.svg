  <text x="934" y="128" font-family="Pretendard, system-ui, sans-serif"
        font-size="17" font-weight="700" fill="#E65100">Gemini 2.5 Flash · 판정</text>
  <text x="934" y="148" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">LLM Multi-modal Analysis</text>

  <line x1="884" y1="164" x2="1236" y2="164" stroke="#FFD54F" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="884" y="186" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" font-weight="600" fill="#E65100">입력</text>
  <rect x="884" y="194" width="352" height="52" rx="8" fill="#FFFFFF" stroke="#FFD54F" stroke-width="1"/>
