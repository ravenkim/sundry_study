        font-size="12" fill="#5F6368">• 원본 이미지</text>
  <text x="900" y="232" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">• Step1+2 결과: light_on, ac_on, waste_kw</text>

  <text x="884" y="262" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" font-weight="600" fill="#E65100">처리 방식</text>
  <rect x="884" y="270" width="352" height="96" rx="8" fill="#FFFFFF" stroke="#FFD54F" stroke-width="1"/>
  <text x="900" y="290" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">• 이미지 + YOLO 메타 통합 분석</text>
  <text x="900" y="308" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">• 빈 강의실 여부 최종 판정 (JSON)</text>
  <text x="900" y="326" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">• 절감 예상액 원화 산출</text>
  <text x="900" y="344" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">• 포인트 계산 (절감액 기반)</text>

  <text x="884" y="380" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" font-weight="600" fill="#E65100">출력 JSON</text>
  <rect x="884" y="388" width="352" height="100" rx="8" fill="#1A237E" stroke="#FFD54F" stroke-width="1"/>
  <text x="900" y="408" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#4CAF50">{"waste": true,</text>
  <text x="900" y="426" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#4CAF50">  "light_on": true, "ac_on": false,</text>
  <text x="900" y="444" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#FFC107">  "expected": 12400,</text>
  <text x="900" y="462" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#4285F4">  "points": 50,</text>
  <text x="900" y="480" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#EA4335">  "reason": "조명 4세트 방치"}</text>

  <rect x="884" y="504" width="352" height="56" rx="8" fill="#FFF9C4" stroke="#FFD54F" stroke-width="1"/>
  <text x="900" y="524" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" font-weight="600" fill="#E65100">expected 산출 공식</text>
  <text x="900" y="542" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">waste_kw × 1h × 130원/kWh × 가중치</text>
  <text x="900" y="556" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">→ BE에서 포인트 테이블로 변환 저장</text>

  <rect x="884" y="572" width="352" height="60" rx="8" fill="#FFFFFF" stroke="#FFD54F" stroke-width="1"/>
  <text x="900" y="592" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" font-weight="600" fill="#E65100">API 호출 흐름</text>
  <text x="900" y="610" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">FE → BE (multipart) → Cloud Run (FastAPI)</text>
  <text x="900" y="624" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">→ BE 포인트 저장 → FE 결과 표시</text>

  <text x="1240" y="706" text-anchor="end" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" fill="#9AA0A6">04b / 30</text>
</svg>
