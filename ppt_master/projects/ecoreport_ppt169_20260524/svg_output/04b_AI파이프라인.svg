  <rect x="864" y="96" width="392" height="560" rx="16" fill="url(#s04b_step3)" stroke="#FFD54F" stroke-width="1.5"/>
  <rect x="864" y="96" width="392" height="8" rx="4" fill="#FFC107"/>

  <circle cx="900" cy="136" r="22" fill="#FFC107"/>
  <text x="900" y="143" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
