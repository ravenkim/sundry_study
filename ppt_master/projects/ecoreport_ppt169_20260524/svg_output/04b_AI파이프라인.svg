  <text x="94" y="148" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">Light Detection Model</text>

  <line x1="44" y1="164" x2="360" y2="164" stroke="#90CAF9" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- 입력 -->
  <text x="44" y="186" font-family="Pretendard, system-ui, sans-serif"
