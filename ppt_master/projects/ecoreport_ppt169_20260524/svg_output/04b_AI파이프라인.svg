  <rect x="44" y="194" width="316" height="40" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1"/>
  <use data-icon="tabler-outline/photo" x="56" y="204" width="20" height="20" fill="#4285F4"/>
  <text x="82" y="219" font-family="Pretendard, system-ui, sans-serif"
