  <!-- 성능 배지 -->
  <rect x="44" y="516" width="316" height="112" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1"/>
  <text x="60" y="536" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" font-weight="600" fill="#1565C0">학습 데이터</text>
  <text x="60" y="554" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">직접 촬영 + 오픈소스 · 800장+</text>
  <text x="60" y="572" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" font-weight="600" fill="#1565C0">추론 속도</text>
  <text x="60" y="590" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">Cloud Run CPU · 평균 ~1.2초/장</text>
  <text x="60" y="608" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" font-weight="600" fill="#1565C0">배포</text>
  <text x="60" y="624" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">Google Cloud Run (FastAPI 서빙)</text>

  <!-- 화살표 1→2 -->
  <line x1="393" y1="376" x2="437" y2="376" stroke="#5F6368" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#s04b_arrow)"/>
  <text x="415" y="366" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
