  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#s04b_topBar)"/>
  <rect x="0" y="6" width="10" height="178" fill="#4CAF50"/>
  <rect x="0" y="184" width="10" height="178" fill="#FFC107"/>
  <rect x="0" y="362" width="10" height="178" fill="#4285F4"/>
  <rect x="0" y="540" width="10" height="180" fill="#EA4335"/>

  <!-- 제목 -->
  <text x="40" y="54" font-family="Pretendard, system-ui, sans-serif"
        font-size="34" font-weight="700" fill="#1A237E">3단계 AI 분석 파이프라인</text>
  <rect x="40" y="64" width="220" height="4" rx="2" fill="#4285F4"/>
  <rect x="268" y="64" width="80" height="4" rx="2" fill="#4CAF50"/>
  <text x="40" y="84" font-family="Pretendard, system-ui, sans-serif"
        font-size="14" fill="#9AA0A6">사진 1장 → 3단계 AI → 에너지 낭비 판별 + 절감 예상액 산출</text>

  <!-- Step 1: YOLOv8n 조명 감지 -->
  <rect x="24" y="96" width="356" height="560" rx="16" fill="url(#s04b_step1)" stroke="#90CAF9" stroke-width="1.5"/>
  <rect x="24" y="96" width="356" height="8" rx="4" fill="#4285F4"/>

  <circle cx="60" cy="136" r="22" fill="#4285F4"/>
  <text x="60" y="143" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
