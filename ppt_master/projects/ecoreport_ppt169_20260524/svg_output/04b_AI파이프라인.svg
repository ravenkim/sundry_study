        font-size="12" font-weight="600" fill="#2E7D32">모델 정보</text>
  <text x="480" y="476" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">YOLOv8n · 에어컨 ON/OFF 특화</text>
  <text x="480" y="492" font-family="Pretendard, system-ui, sans-serif"
