  <text x="514" y="148" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">AC Detection Model</text>

  <line x1="464" y1="164" x2="780" y2="164" stroke="#A5D6A7" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="464" y="186" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" font-weight="600" fill="#2E7D32">입력</text>
  <rect x="464" y="194" width="316" height="40" rx="8" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1"/>
  <use data-icon="tabler-outline/air-conditioning" x="476" y="204" width="20" height="20" fill="#4CAF50"/>
  <text x="502" y="219" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" fill="#5F6368">동일 이미지 (Step 1과 병렬 처리)</text>

  <text x="464" y="254" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" font-weight="600" fill="#2E7D32">처리 방식</text>
  <rect x="464" y="262" width="316" height="84" rx="8" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1"/>
  <text x="480" y="282" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" fill="#5F6368">• 에어컨 유닛 bbox 탐지</text>
  <text x="480" y="302" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" fill="#5F6368">• 동작 LED/패널 상태 분석</text>
  <text x="480" y="322" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" fill="#5F6368">• ON 판정 → 소비전력 추정</text>

  <text x="464" y="362" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" font-weight="600" fill="#2E7D32">출력</text>
  <rect x="464" y="370" width="152" height="52" rx="8" fill="#4CAF50" fill-opacity="0.15" stroke="#4CAF50" stroke-width="1"/>
  <text x="540" y="392" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" font-weight="700" fill="#2E7D32">ac_on: true</text>
  <text x="540" y="410" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#5F6368">count: N</text>
  <rect x="628" y="370" width="152" height="52" rx="8" fill="#9AA0A6" fill-opacity="0.1" stroke="#9AA0A6" stroke-width="1"/>
  <text x="704" y="392" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" font-weight="700" fill="#5F6368">ac_on: false</text>

  <rect x="464" y="438" width="316" height="60" rx="8" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
