  <text x="415" y="380" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="11" fill="#9AA0A6">ON시</text>

  <!-- Step 2: YOLOv8n 에어컨 감지 -->
  <rect x="444" y="96" width="356" height="560" rx="16" fill="url(#s04b_step2)" stroke="#A5D6A7" stroke-width="1.5"/>
  <rect x="444" y="96" width="356" height="8" rx="4" fill="#4CAF50"/>

  <circle cx="480" cy="136" r="22" fill="#4CAF50"/>
