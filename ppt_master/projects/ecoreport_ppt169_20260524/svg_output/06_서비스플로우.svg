  <rect x="40"  y="64" width="140" height="4" rx="2" fill="#4CAF50"/>
  <rect x="188" y="64" width="90"  height="4" rx="2" fill="#FFC107"/>
  <rect x="286" y="64" width="90"  height="4" rx="2" fill="#4285F4"/>

