  <rect x="44" y="120" width="120" height="3" rx="1" fill="#4CAF50"/>

  <!-- 강점 항목 -->
  <rect x="44" y="136" width="410" height="72" rx="10" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <use data-icon="tabler-outline/users" x="60" y="152" width="24" height="24" fill="#4CAF50"/>
  <text x="96" y="167" font-family="Pretendard, system-ui, sans-serif"
