  <!-- 사이클 원형 다이어그램 -->
  <circle cx="876" cy="370" r="90" fill="#FFFFFF" stroke="#4CAF50" stroke-width="2"/>
  <circle cx="876" cy="370" r="65" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
