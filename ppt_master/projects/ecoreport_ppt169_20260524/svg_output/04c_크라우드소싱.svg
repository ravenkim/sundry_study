  <text x="44" y="580" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" fill="#9AA0A6">→ EcoReport: 교내 에너지 인프라에 동일 모델 적용</text>

  <!-- 우측: 게임화 전략 -->
  <rect x="496" y="80" width="760" height="580" rx="16" fill="url(#s04c_cycleBg)" stroke="#4CAF50" stroke-width="1.5"/>
  <rect x="496" y="80" width="760" height="8" rx="4" fill="#4CAF50"/>

  <text x="876" y="116" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
