  <!-- 화살표들 -->
  <path d="M 876 204 A 166 166 0 0 1 1010 340" stroke="#4CAF50" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#s04c_arrow)"/>
  <path d="M 1010 372 A 166 166 0 0 1 876 476" stroke="#4CAF50" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#s04c_arrow)"/>
  <path d="M 776 508 A 166 166 0 0 1 640 372" stroke="#4CAF50" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#s04c_arrow)"/>
  <path d="M 640 340 A 166 166 0 0 1 776 172" stroke="#4CAF50" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#s04c_arrow)"/>

  <!-- 포인트 지급 기준 -->
  <rect x="516" y="584" width="720" height="64" rx="10" fill="#1A237E"/>
  <text x="876" y="608" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
