<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="s05c_topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="33%" stop-color="#FFC107"/>
      <stop offset="66%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#EA4335"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#s05c_topBar)"/>
  <rect x="0" y="6" width="10" height="178" fill="#4CAF50"/>
  <rect x="0" y="184" width="10" height="178" fill="#FFC107"/>
  <rect x="0" y="362" width="10" height="178" fill="#4285F4"/>
  <rect x="0" y="540" width="10" height="180" fill="#EA4335"/>

  <!-- 제목 -->
  <text x="40" y="50" font-family="Pretendard, system-ui, sans-serif"
        font-size="28" font-weight="700" fill="#1A237E">관리자 대시보드 — UI 투어</text>
  <rect x="40" y="58" width="210" height="3" rx="2" fill="#4285F4"/>
  <text x="40" y="76" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" fill="#9AA0A6">관리자 전용 웹 인터페이스 — 실제 구현 화면 (1280×800 데스크톱)</text>

  <!-- 관리자 스크린샷: 1280×800 비율 = 1.6:1 (가로) -->
  <!-- 프레임 크기: 400×250 = 1.6:1 완벽 매칭 -->
  <!-- Row 1: 3개 (y=82~340), Row 2: 3개 (y=352~606), 라벨(y=612~640) -->
  <!-- x: 20 | 432 | 844  (gap=12, 각 400px) -->

  <!-- ===== ROW 1 ===== -->
  <!-- R1 C1: 대시보드 -->
  <rect x="20" y="82" width="400" height="250" rx="10" fill="#F8F9FA" stroke="#1A237E" stroke-width="2"/>
  <rect x="20" y="82" width="400" height="5" rx="2" fill="#1A237E"/>
  <image href="../images/screen_admin_dashboard.png" x="20" y="87" width="400" height="245" preserveAspectRatio="xMidYMid slice"/>
  <rect x="20" y="334" width="400" height="30" rx="6" fill="#1A237E"/>
  <text x="220" y="354" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
