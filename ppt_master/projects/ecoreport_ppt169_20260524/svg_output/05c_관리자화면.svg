  <!-- ===== ROW 2 ===== -->
  <!-- R2 C1: 절약 통계 -->
  <rect x="20" y="370" width="400" height="250" rx="10" fill="#F8F9FA" stroke="#FFC107" stroke-width="2"/>
  <rect x="20" y="370" width="400" height="5" rx="2" fill="#FFC107"/>
  <image href="../images/screen_admin_stats.png" x="20" y="375" width="400" height="245" preserveAspectRatio="xMidYMid slice"/>
  <rect x="20" y="622" width="400" height="30" rx="6" fill="#FFC107"/>
  <text x="220" y="642" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
