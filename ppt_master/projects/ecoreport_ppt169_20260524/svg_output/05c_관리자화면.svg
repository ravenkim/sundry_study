  <!-- R1 C2: 제보 목록 -->
  <rect x="432" y="82" width="400" height="250" rx="10" fill="#F8F9FA" stroke="#4285F4" stroke-width="2"/>
  <rect x="432" y="82" width="400" height="5" rx="2" fill="#4285F4"/>
  <image href="../images/screen_admin_reports.png" x="432" y="87" width="400" height="245" preserveAspectRatio="xMidYMid slice"/>
  <rect x="432" y="334" width="400" height="30" rx="6" fill="#4285F4"/>
  <text x="632" y="354" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" font-weight="700" fill="#FFFFFF">제보 목록</text>

  <!-- R1 C3: 장소 관리 -->
  <rect x="844" y="82" width="416" height="250" rx="10" fill="#F8F9FA" stroke="#4CAF50" stroke-width="2"/>
  <rect x="844" y="82" width="416" height="5" rx="2" fill="#4CAF50"/>
  <image href="../images/screen_admin_buildings.png" x="844" y="87" width="416" height="245" preserveAspectRatio="xMidYMid slice"/>
  <rect x="844" y="334" width="416" height="30" rx="6" fill="#4CAF50"/>
  <text x="1052" y="354" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
