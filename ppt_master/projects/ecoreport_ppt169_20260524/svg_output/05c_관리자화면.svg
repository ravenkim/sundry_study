  <!-- R2 C2: 포인트 관리 -->
  <rect x="432" y="370" width="400" height="250" rx="10" fill="#F8F9FA" stroke="#EA4335" stroke-width="2"/>
  <rect x="432" y="370" width="400" height="5" rx="2" fill="#EA4335"/>
  <image href="../images/screen_admin_points.png" x="432" y="375" width="400" height="245" preserveAspectRatio="xMidYMid slice"/>
  <rect x="432" y="622" width="400" height="30" rx="6" fill="#EA4335"/>
  <text x="632" y="642" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" font-weight="700" fill="#FFFFFF">포인트 관리</text>

  <!-- R2 C3: 사용자 관리 -->
  <rect x="844" y="370" width="416" height="250" rx="10" fill="#F8F9FA" stroke="#9C27B0" stroke-width="2"/>
  <rect x="844" y="370" width="416" height="5" rx="2" fill="#9C27B0"/>
  <image href="../images/screen_admin_users.png" x="844" y="375" width="416" height="245" preserveAspectRatio="xMidYMid slice"/>
  <rect x="844" y="622" width="416" height="30" rx="6" fill="#9C27B0"/>
  <text x="1052" y="642" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
