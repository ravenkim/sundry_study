  <!-- 하단 요약 -->
  <rect x="20" y="658" width="1240" height="44" rx="10" fill="#1A237E"/>
  <text x="640" y="676" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" font-weight="700" fill="#FFFFFF">관리자 6개 화면 — 제보 · 장소 · 포인트 · 통계 · 사용자 관리 완성 ✅</text>
  <text x="640" y="695" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="11" fill="#9AA0A6">React 19 · shadcn/ui · Redux-Saga · Spring Boot 4 REST API</text>

  <text x="1240" y="716" text-anchor="end" font-family="Pretendard, system-ui, sans-serif"
        font-size="11" fill="#9AA0A6">05c / 30</text>
</svg>
