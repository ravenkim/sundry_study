<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="s05d_topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="33%" stop-color="#FFC107"/>
      <stop offset="66%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#EA4335"/>
    </linearGradient>
    <linearGradient id="s05d_pointBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFECB3"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#s05d_topBar)"/>
  <rect x="0" y="6" width="10" height="178" fill="#4CAF50"/>
  <rect x="0" y="184" width="10" height="178" fill="#FFC107"/>
  <rect x="0" y="362" width="10" height="178" fill="#4285F4"/>
  <rect x="0" y="540" width="10" height="180" fill="#EA4335"/>

  <!-- 제목 -->
  <text x="40" y="50" font-family="Pretendard, system-ui, sans-serif"
        font-size="30" font-weight="700" fill="#1A237E">포인트 시스템 설계</text>
  <rect x="40" y="58" width="180" height="3" rx="2" fill="#FFC107"/>

  <!-- ======= 좌측: 포인트 적립 기준 테이블 ======= -->
  <rect x="20" y="70" width="580" height="368" rx="14" fill="url(#s05d_pointBg)" stroke="#FFD54F" stroke-width="1.5"/>
  <rect x="20" y="70" width="580" height="7" rx="3" fill="#FFC107"/>

  <use data-icon="tabler-outline/coins" x="38" y="86" width="26" height="26" fill="#E65100"/>
  <text x="72" y="104" font-family="Pretendard, system-ui, sans-serif"
        font-size="16" font-weight="700" fill="#E65100">포인트 적립 기준</text>
  <text x="72" y="120" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#9AA0A6">Gemini AI가 절감 예상액 기반 동적 산출</text>

  <!-- 테이블 헤더 -->
  <rect x="38" y="130" width="543" height="34" rx="6" fill="#E65100" fill-opacity="0.15"/>
  <text x="120" y="153" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" font-weight="700" fill="#E65100">제보 유형</text>
  <text x="330" y="153" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" font-weight="700" fill="#E65100">예상 절감액/시간</text>
  <text x="530" y="153" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" font-weight="700" fill="#E65100">적립 포인트</text>

  <!-- Row 1 -->
  <rect x="38" y="164" width="543" height="36" rx="3" fill="#FFFFFF" fill-opacity="0.7"/>
  <text x="120" y="187" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">조명만 ON</text>
  <text x="330" y="187" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">~1,040원</text>
  <text x="530" y="187" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E65100">30P</text>

  <!-- Row 2 -->
  <rect x="38" y="200" width="543" height="36" rx="3" fill="#FFF9C4" fill-opacity="0.6"/>
  <text x="120" y="223" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">에어컨만 ON</text>
  <text x="330" y="223" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">~19,500원</text>
  <text x="530" y="223" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E65100">50P</text>

  <!-- Row 3 -->
  <rect x="38" y="236" width="543" height="36" rx="3" fill="#FFFFFF" fill-opacity="0.7"/>
  <text x="120" y="259" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">조명 + 에어컨 모두 ON</text>
  <text x="330" y="259" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">~20,540원</text>
  <text x="530" y="259" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="16" font-weight="800" fill="#EA4335">80P</text>

  <!-- Row 4 -->
  <rect x="38" y="272" width="543" height="36" rx="3" fill="#FFF9C4" fill-opacity="0.4"/>
  <text x="120" y="295" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#9AA0A6">낭비 없음 (불채택)</text>
  <text x="330" y="295" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#9AA0A6">—</text>
  <text x="530" y="295" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#9AA0A6">0P</text>

  <text x="38" y="328" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">* 1P = 1원 환산. 교환 최소 500P 이상</text>
  <text x="38" y="346" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">* 동일 장소·동일 사용자 24시간 내 중복 제보 차단</text>
  <text x="38" y="364" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">* expected = waste_kw × 130원 × 가중치 (Gemini 자동 산출)</text>
  <text x="38" y="382" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">* AI 신뢰도 0.5 미만 시 관리자 수동 검토 대기</text>

  <!-- ======= 좌측 하단: 교환 보상 ======= -->
  <rect x="20" y="450" width="580" height="250" rx="14" fill="#F8F9FA" stroke="#E8EAED" stroke-width="1.5"/>
  <rect x="20" y="450" width="580" height="7" rx="3" fill="#4CAF50"/>
  <use data-icon="tabler-outline/gift" x="38" y="468" width="24" height="24" fill="#4CAF50"/>
  <text x="70" y="484" font-family="Pretendard, system-ui, sans-serif"
        font-size="15" font-weight="700" fill="#2E7D32">교환 가능 보상</text>

  <rect x="38" y="496" width="118" height="80" rx="10" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.5"/>
  <use data-icon="tabler-outline/coffee" x="85" y="508" width="26" height="26" fill="#4CAF50"/>
  <text x="97" y="552" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2E7D32">커피 쿠폰</text>
  <text x="97" y="568" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">500P~</text>

  <rect x="168" y="496" width="118" height="80" rx="10" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5"/>
  <use data-icon="tabler-outline/device-mobile" x="215" y="508" width="26" height="26" fill="#4285F4"/>
  <text x="227" y="552" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1565C0">편의점 상품권</text>
  <text x="227" y="568" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">1,000P~</text>

  <rect x="298" y="496" width="118" height="80" rx="10" fill="#FFFFFF" stroke="#FFD54F" stroke-width="1.5"/>
  <use data-icon="tabler-outline/ticket" x="345" y="508" width="26" height="26" fill="#FFC107"/>
  <text x="357" y="552" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="12" font-weight="600" fill="#E65100">문화상품권</text>
  <text x="357" y="568" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">3,000P~</text>

  <rect x="428" y="496" width="152" height="80" rx="10" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <use data-icon="tabler-outline/leaf" x="492" y="508" width="26" height="26" fill="#4CAF50"/>
  <text x="504" y="552" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2E7D32">탄소중립 배지</text>
  <text x="504" y="568" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#5F6368">무료 지급</text>

  <text x="38" y="608" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" fill="#5F6368">포인트 사용처 확장: 학교 식당 · 도서관 프린트 · 기숙사 포인트 연계 (Phase 2)</text>
  <text x="38" y="628" font-family="Pretendard, system-ui, sans-serif"
        font-size="13" fill="#5F6368">기업 협찬 리워드 추가 가능 — 참여 학생 수 증가에 따라 협상력 상승</text>
  <text x="38" y="650" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#9AA0A6">* 현재 MVP: 포인트 조회 완료, 교환 UI 구현 완료, 실제 지급 로직 Phase 1 예정</text>
  <text x="38" y="668" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#9AA0A6">* 포인트 재원: 학교 절약 전기료 일부를 포인트 예산으로 전환 (계약 조건)</text>

  <!-- ======= 우측: 수익 시뮬레이션 ======= -->
  <rect x="620" y="70" width="640" height="370" rx="14" fill="#1A237E"/>
  <rect x="620" y="70" width="640" height="7" rx="3" fill="#4285F4"/>

  <text x="940" y="100" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="17" font-weight="700" fill="#FFFFFF">학생 수익 시뮬레이션</text>
  <text x="940" y="118" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#9AA0A6">주 3회 · 평균 50P/회 기준</text>

  <!-- 시뮬레이션 행들 -->
  <rect x="638" y="130" width="604" height="46" rx="8" fill="#FFFFFF" fill-opacity="0.07"/>
  <text x="658" y="152" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#9AA0A6">주간 적립</text>
  <text x="940" y="152" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#FFFFFF">3회 × 50P = 150P / 주</text>
  <text x="1220" y="169" text-anchor="end" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">매일 5분</text>

  <rect x="638" y="182" width="604" height="46" rx="8" fill="#FFFFFF" fill-opacity="0.07"/>
  <text x="658" y="204" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#9AA0A6">월간 적립</text>
  <text x="940" y="204" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#FFFFFF">150P × 4주 = 600P / 월</text>
  <text x="1220" y="221" text-anchor="end" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">≈ 600원</text>

  <rect x="638" y="234" width="604" height="52" rx="8" fill="#4CAF50" fill-opacity="0.2"/>
  <text x="658" y="256" font-family="Pretendard, system-ui, sans-serif" font-size="13" font-weight="600" fill="#9AA0A6">학기 적립 (4개월)</text>
  <text x="940" y="258" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFC107">2,400P</text>
  <text x="940" y="278" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="12" fill="#9AA0A6">커피 4잔 이상 교환 가능</text>

  <rect x="638" y="292" width="604" height="52" rx="8" fill="#4CAF50" fill-opacity="0.3"/>
  <text x="658" y="314" font-family="Pretendard, system-ui, sans-serif" font-size="13" font-weight="600" fill="#9AA0A6">연간 적립 (2학기)</text>
  <text x="940" y="316" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="24" font-weight="800" fill="#4CAF50">4,800P ≈ 4,800원</text>
  <text x="940" y="336" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="12" fill="#A5D6A7">적극 참여(일 2회) 시 연 20,000P+ 가능</text>

  <!-- 포인트 앱 화면 (모바일 프레임, 올바른 비율) -->
  <rect x="620" y="452" width="294" height="248" rx="12" fill="#1A1A2E" stroke="#FFC107" stroke-width="2"/>
  <rect x="620" y="452" width="294" height="5" rx="3" fill="#FFC107"/>
  <image href="../images/screen_shop.png" x="620" y="457" width="294" height="243" preserveAspectRatio="xMidYMid slice"/>
  <text x="767" y="706" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" font-weight="600" fill="#E65100">포인트 샵 화면</text>

  <!-- 우측 하단: 포인트 흐름 요약 -->
  <rect x="926" y="452" width="334" height="248" rx="12" fill="#F8F9FA" stroke="#E8EAED" stroke-width="1.5"/>
  <rect x="926" y="452" width="334" height="7" rx="3" fill="#4CAF50"/>
  <text x="1093" y="478" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="14" font-weight="700" fill="#2E7D32">포인트 재원 흐름</text>

  <text x="946" y="504" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">① 학교 전기료 절약 달성</text>
  <text x="946" y="526" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">② 절약분 20~30% → 포인트 예산</text>
  <text x="946" y="548" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">③ EcoReport 플랫폼 → 학생 지급</text>
  <text x="946" y="570" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">④ 학생 기프티콘 교환</text>
  <rect x="946" y="582" width="294" height="2" rx="1" fill="#E8EAED"/>
  <text x="946" y="604" font-family="Pretendard, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2E7D32">학교: 순 70~80% 비용 절약</text>
  <text x="946" y="622" font-family="Pretendard, system-ui, sans-serif" font-size="13" font-weight="600" fill="#4285F4">학생: 실질 금전 보상</text>
  <text x="946" y="640" font-family="Pretendard, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EA4335">플랫폼: 구독료 + 마진</text>
  <text x="1093" y="688" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif"
        font-size="12" fill="#9AA0A6">3자 Win-Win 지속 가능 구조</text>

  <text x="1240" y="716" text-anchor="end" font-family="Pretendard, system-ui, sans-serif"
        font-size="11" fill="#9AA0A6">05d / 30</text>
</svg>
