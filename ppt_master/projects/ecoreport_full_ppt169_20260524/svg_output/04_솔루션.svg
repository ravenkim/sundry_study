  <text x="840" y="548" font-family="Pretendard, system-ui, -apple-system, sans-serif"
        font-size="14" fill="#2E7D32">● 학생 동기 — 포인트 → 기프티콘 교환</text>
  <text x="840" y="572" font-family="Pretendard, system-ui, -apple-system, sans-serif"
