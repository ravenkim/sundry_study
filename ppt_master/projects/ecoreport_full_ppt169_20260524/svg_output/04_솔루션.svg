  <!-- 마스코트: recognize.png 우측 -->
  <image href="../images/recognize.png" x="844" y="80" width="380" height="250" preserveAspectRatio="xMidYMid meet"/>
  <text x="1034" y="348" text-anchor="middle" font-family="Pretendard, system-ui, -apple-system, sans-serif"
