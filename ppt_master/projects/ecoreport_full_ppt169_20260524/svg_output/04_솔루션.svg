  <!-- AI 3단계 명칭 (우측 하단 영역) -->
  <rect x="820" y="360" width="440" height="60" rx="10" fill="#F8F9FA" stroke="#E8EAED" stroke-width="1"/>
  <text x="840" y="382" font-family="Pretendard, system-ui, -apple-system, sans-serif"
