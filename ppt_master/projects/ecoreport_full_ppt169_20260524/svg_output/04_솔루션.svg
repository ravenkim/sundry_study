  <rect x="40"  y="66" width="100" height="4" rx="2" fill="#4CAF50"/>
  <rect x="148" y="66" width="70"  height="4" rx="2" fill="#FFC107"/>
  <rect x="226" y="66" width="70"  height="4" rx="2" fill="#4285F4"/>
  <rect x="304" y="66" width="100" height="4" rx="2" fill="#EA4335"/>

  <!-- 3축 차별점 배지 -->
