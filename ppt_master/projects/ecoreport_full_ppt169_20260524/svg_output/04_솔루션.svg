  <line x1="840" y1="612" x2="1240" y2="612" stroke="#4CAF50" stroke-width="1" stroke-opacity="0.4"/>
  <text x="1040" y="648" text-anchor="middle" font-family="Pretendard, system-ui, -apple-system, sans-serif"
