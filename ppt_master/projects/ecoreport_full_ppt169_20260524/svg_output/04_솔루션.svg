  <rect x="445" y="130" width="355" height="190" rx="14" fill="url(#s04_ecoBg)" stroke="#4CAF50" stroke-width="2"/>
  <rect x="445" y="130" width="355" height="6" rx="3" fill="#4CAF50"/>
  <!-- 추천 배지 -->
  <rect x="546" y="118" width="72" height="22" rx="11" fill="#FFC107"/>
  <text x="582" y="133" text-anchor="middle" font-family="Pretendard, system-ui, -apple-system, sans-serif"
