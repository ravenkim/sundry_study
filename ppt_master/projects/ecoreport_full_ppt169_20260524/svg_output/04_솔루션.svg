  <text x="1040" y="668" text-anchor="middle" font-family="Pretendard, system-ui, -apple-system, sans-serif"
        font-size="13" fill="#9AA0A6">절약분의 일부가 보상 재원 — 지속 가능한 구조</text>

  <!-- 페이지 번호 -->
  <text x="1240" y="706" text-anchor="end" font-family="Pretendard, system-ui, -apple-system, sans-serif"
