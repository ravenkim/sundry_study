  <rect x="40" y="388" width="760" height="280" rx="20" fill="#F8F9FA" fill-opacity="0.6"/>

  <!-- 노드 간 연결선 -->
  <!-- 1→2 -->
  <line x1="175" y1="527" x2="295" y2="527" stroke="#4CAF50" stroke-width="2.5" stroke-opacity="0.7"
