  <rect x="68" y="410" width="660" height="100" rx="12" fill="#F8F9FA" stroke="#E8EAED" stroke-width="1"/>
  <use data-icon="tabler-outline/cloud-computing" x="88" y="426" width="22" height="22" fill="#5F6368"/>
  <text x="118" y="440" font-family="Pretendard, system-ui, -apple-system, sans-serif"
        font-size="14" font-weight="700" fill="#5F6368">GitHub</text>
  <text x="186" y="440" font-family="Pretendard, system-ui, -apple-system, sans-serif"
        font-size="14" fill="#4285F4">https://github.com/ravenkim/duyuthon</text>

  <use data-icon="tabler-outline/bolt" x="88" y="456" width="22" height="22" fill="#5F6368"/>
  <text x="118" y="470" font-family="Pretendard, system-ui, -apple-system, sans-serif"
