  <text x="608" y="564" text-anchor="middle" font-family="Pretendard, system-ui, -apple-system, sans-serif"
        font-size="11" fill="#FFFDE7">Student-Driven</text>

  <!-- 카드 하단 컬러 도트 장식 -->
  <circle cx="228" cy="613" r="7"  fill="#4CAF50" fill-opacity="0.85"/>
  <circle cx="254" cy="613" r="5"  fill="#FFC107" fill-opacity="0.85"/>
  <circle cx="276" cy="613" r="9"  fill="#4285F4" fill-opacity="0.85"/>
  <circle cx="304" cy="613" r="5"  fill="#EA4335" fill-opacity="0.85"/>
  <circle cx="328" cy="613" r="7"  fill="#4CAF50" fill-opacity="0.85"/>
  <circle cx="354" cy="613" r="5"  fill="#FFC107" fill-opacity="0.85"/>
  <circle cx="376" cy="613" r="9"  fill="#4285F4" fill-opacity="0.85"/>
  <circle cx="404" cy="613" r="5"  fill="#EA4335" fill-opacity="0.85"/>
  <circle cx="428" cy="613" r="7"  fill="#4CAF50" fill-opacity="0.85"/>
  <circle cx="454" cy="613" r="5"  fill="#FFC107" fill-opacity="0.85"/>
  <circle cx="476" cy="613" r="9"  fill="#4285F4" fill-opacity="0.85"/>
  <circle cx="504" cy="613" r="5"  fill="#EA4335" fill-opacity="0.85"/>

  <!-- 마스코트: smile.png 우측 크게 -->
  <image href="../images/smile.png" x="810" y="60" width="430" height="620" preserveAspectRatio="xMidYMid meet"/>

  <!-- 감사 문구 (우측 하단) -->
  <text x="1040" y="686" text-anchor="middle" font-family="Pretendard, system-ui, -apple-system, sans-serif"
        font-size="16" font-weight="600" fill="#9AA0A6">감사합니다</text>
  <text x="1040" y="704" text-anchor="middle" font-family="Pretendard, system-ui, -apple-system, sans-serif"
        font-size="13" fill="#9AA0A6">EcoReport · 2026 두유톤</text>

</svg>
