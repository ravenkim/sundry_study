<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">

  <defs>
    <linearGradient id="s10_bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F1F8E9"/>
      <stop offset="100%" stop-color="#E8F5E9"/>
    </linearGradient>
    <linearGradient id="s10_topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4CAF50"/>
      <stop offset="33%"  stop-color="#FFC107"/>
      <stop offset="66%"  stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#EA4335"/>
    </linearGradient>
    <linearGradient id="s10_msgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
    <linearGradient id="s10_cardTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4CAF50"/>
      <stop offset="50%"  stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1280" height="720" fill="url(#s10_bgGrad)"/>

  <!-- 장식 원 -->
  <circle cx="100" cy="620" r="160" fill="#4CAF50" fill-opacity="0.06"/>
  <circle cx="1180" cy="100" r="130" fill="#FFC107" fill-opacity="0.08"/>
  <circle cx="900" cy="660" r="90" fill="#4285F4" fill-opacity="0.05"/>

  <!-- 상단 6px 그라데이션 바 -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#s10_topBar)"/>

  <!-- 좌측 4색 세로 바 -->
  <rect x="0" y="6"   width="10" height="178" fill="#4CAF50"/>
  <rect x="0" y="184" width="10" height="178" fill="#FFC107"/>
  <rect x="0" y="362" width="10" height="178" fill="#4285F4"/>
  <rect x="0" y="540" width="10" height="180" fill="#EA4335"/>

  <!-- 메인 카드 -->
  <rect x="38" y="70" width="730" height="570" rx="22" fill="#FFFFFF" stroke="#E8EAED" stroke-width="1.5"/>
  <!-- 카드 상단 색상 바 -->
  <rect x="38" y="70" width="730" height="7" rx="3" fill="url(#s10_cardTop)"/>

  <!-- 팀 배지 -->
  <rect x="68" y="108" width="116" height="30" rx="15" fill="#4CAF50" fill-opacity="0.12" stroke="#4CAF50" stroke-width="1"/>
  <text x="126" y="127" text-anchor="middle" font-family="Pretendard, system-ui, -apple-system, sans-serif"
        font-size="13" font-weight="700" fill="#2E7D32">14팀 발표</text>

  <!-- Q&A 배지 (우측) -->
  <rect x="600" y="108" width="140" height="30" rx="15" fill="#1A237E"/>
  <text x="670" y="127" text-anchor="middle" font-family="Pretendard, system-ui, -apple-system, sans-serif"
        font-size="13" font-weight="700" fill="#FFFFFF">Q &amp; A</text>

  <!-- 핵심 메시지 -->
  <text x="403" y="210" text-anchor="middle" font-family="Pretendard, system-ui, -apple-system, sans-serif"
