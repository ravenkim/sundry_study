  <text x="403" y="258" text-anchor="middle" font-family="Pretendard, system-ui, -apple-system, sans-serif"
        font-size="34" font-weight="700" fill="url(#s10_msgGrad)">캠퍼스 전기료를 줄입니다."</text>

  <!-- 4색 구분선 -->
  <line x1="100" y1="292" x2="268" y2="292" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
  <line x1="284" y1="292" x2="396" y2="292" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
  <line x1="412" y1="292" x2="524" y2="292" stroke="#4285F4" stroke-width="3" stroke-linecap="round"/>
  <line x1="540" y1="292" x2="706" y2="292" stroke="#EA4335" stroke-width="3" stroke-linecap="round"/>

