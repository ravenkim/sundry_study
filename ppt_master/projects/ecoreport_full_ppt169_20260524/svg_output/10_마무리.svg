  <use data-icon="tabler-outline/recycle" x="88" y="486" width="22" height="22" fill="#5F6368"/>
  <text x="118" y="500" font-family="Pretendard, system-ui, -apple-system, sans-serif"
        font-size="14" font-weight="700" fill="#5F6368">AI 파이프라인</text>
  <text x="210" y="500" font-family="Pretendard, system-ui, -apple-system, sans-serif"
        font-size="14" fill="#9C27B0">YOLOv8n × 2 + Gemini 2.5 Flash · Cloud Run ✅</text>

  <!-- 요약 핵심 배지 3개 -->
  <rect x="68"  y="528" width="195" height="44" rx="22" fill="#4CAF50"/>
  <text x="165" y="546" text-anchor="middle" font-family="Pretendard, system-ui, -apple-system, sans-serif"
