  <text x="96" y="328" font-family="Pretendard, system-ui, sans-serif" font-size="14" fill="#5F6368">YOLOv8n confidence &lt; 0.5 → 판정 보류, 수동 검토 대기 상태</text>
  <text x="96" y="348" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">Gemini 판정 불일치 시(waste=false) → 포인트 미지급</text>
  <text x="96" y="368" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">흐릿한 사진, 조작된 이미지 = AI가 낭비 없음으로 판정</text>
  <path fill="#FFC107" fill-opacity="0.2" stroke="#FFC107" stroke-width="1" d="M497,286 H591 A17,17 0 0 1 608,303 V303 A17,17 0 0 1 591,320 H497 A17,17 0 0 1 480,303 V303 A17,17 0 0 1 497,286 Z" />
