  <path fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.5" d="M38,270 H606 A14,14 0 0 1 620,284 V416 A14,14 0 0 1 606,430 H38 A14,14 0 0 1 24,416 V284 A14,14 0 0 1 38,270 Z" />
