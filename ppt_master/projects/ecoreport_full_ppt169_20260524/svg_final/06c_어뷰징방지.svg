  <text x="732" y="306" font-family="Pretendard, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1565C0">관리자 수동 검토</text>
  <text x="732" y="328" font-family="Pretendard, system-ui, sans-serif" font-size="14" fill="#5F6368">AI 신뢰도 낮은 제보는 PENDING 상태 → 관리자 대시보드 큐</text>
  <text x="732" y="348" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">관리자 APPROVE/REJECT → 포인트 확정 또는 취소</text>
  <text x="732" y="368" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">반복 어뷰징 사용자 계정 제한(ROLE 변경)</text>
