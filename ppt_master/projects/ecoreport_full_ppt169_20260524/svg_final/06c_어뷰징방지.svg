  <text x="732" y="132" font-family="Pretendard, system-ui, sans-serif" font-size="17" font-weight="700" fill="#2E7D32">운영 시간 검증</text>
  <text x="732" y="154" font-family="Pretendard, system-ui, sans-serif" font-size="14" fill="#5F6368">LocationNode의 운영 스케줄(요일별 ON/OFF) 기반 자동 검증</text>
  <text x="732" y="174" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">수업 없는 시간대(일요일 새벽 등) 제보는 낮은 점수</text>
  <text x="732" y="192" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">location_operating_schedule DB 테이블 활용</text>
