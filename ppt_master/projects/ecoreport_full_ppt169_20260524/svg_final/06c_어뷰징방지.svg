  <text x="88" y="481" font-family="Pretendard, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2E7D32">다층 방어로 포인트 부정 취득 원천 차단</text>
  <text x="88" y="503" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">L1(DB중복방지) → L2(AI신뢰도) → L3(운영시간) → L4(관리자검토) — 각 레이어 독립 동작</text>

  
  <path fill="#FFEBEE" stroke="#EF9A9A" stroke-width="1" d="M36,540 H608 A12,12 0 0 1 620,552 V672 A12,12 0 0 1 608,684 H36 A12,12 0 0 1 24,672 V552 A12,12 0 0 1 36,540 Z" />
  <text x="44" y="566" font-family="Pretendard, system-ui, sans-serif" font-size="15" font-weight="700" fill="#C62828">예상 어뷰징 시도</text>
  <text x="44" y="588" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 같은 장소 여러 번 촬영하여 포인트 중복 수령</text>
  <text x="44" y="606" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 어두운/흐린 사진으로 AI 속이기</text>
  <text x="44" y="624" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 실제로 켜져 있지 않은 설비 신고</text>
  <text x="44" y="642" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">• 새벽 등 운영 외 시간대 조작 제보</text>
  <text x="44" y="660" font-family="Pretendard, system-ui, sans-serif" font-size="12" fill="#9AA0A6">→ L1~L4 레이어가 각각 차단</text>

  <path fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1" d="M672,540 H1244 A12,12 0 0 1 1256,552 V672 A12,12 0 0 1 1244,684 H672 A12,12 0 0 1 660,672 V552 A12,12 0 0 1 672,540 Z" />
  <text x="680" y="566" font-family="Pretendard, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2E7D32">차단 방식</text>
  <text x="680" y="588" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">→ DB unique 제약으로 409 반환, 포인트 0</text>
  <text x="680" y="606" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">→ YOLO confidence &lt; 0.5 → 보류 후 관리자 검토</text>
  <text x="680" y="624" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">→ Gemini waste=false → 즉시 포인트 0 반환</text>
  <text x="680" y="642" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">→ 운영시간 외 감점 + 관리자 REJECT 가능</text>
  <text x="680" y="660" font-family="Pretendard, system-ui, sans-serif" font-size="12" fill="#9AA0A6">→ 반복 시 계정 제한</text>

