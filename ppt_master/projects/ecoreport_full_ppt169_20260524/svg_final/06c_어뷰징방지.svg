  <text x="96" y="132" font-family="Pretendard, system-ui, sans-serif" font-size="17" font-weight="700" fill="#C62828">중복 제보 차단</text>
  <text x="96" y="154" font-family="Pretendard, system-ui, sans-serif" font-size="14" fill="#5F6368">동일 장소(LocationNode ID) + 동일 사용자 = 24시간 이내 1회만 허용</text>
  <text x="96" y="174" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">DB unique constraint: (member_id, location_id, date)</text>
  <text x="96" y="192" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">중복 시도 시 409 Conflict 반환, 포인트 미지급</text>
