  <text x="40" y="54" font-family="Pretendard, system-ui, sans-serif" font-size="34" font-weight="700" fill="#1A237E">환경 임팩트 계산</text>
  <path fill="#4CAF50" d="M42,64 H228 A2,2 0 0 1 230,66 V66 A2,2 0 0 1 228,68 H42 A2,2 0 0 1 40,66 V66 A2,2 0 0 1 42,64 Z" />
  <path fill="#FFC107" d="M240,64 H296 A2,2 0 0 1 298,66 V66 A2,2 0 0 1 296,68 H240 A2,2 0 0 1 238,66 V66 A2,2 0 0 1 240,64 Z" />
  <text x="40" y="84" font-family="Pretendard, system-ui, sans-serif" font-size="14" fill="#5F6368">100개 강의실 기준 · 조명+에어컨 방치 하루 3시간 절감 가정</text>

  
  
  <path fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.5" d="M38,96 H590 A14,14 0 0 1 604,110 V212 A14,14 0 0 1 590,226 H38 A14,14 0 0 1 24,212 V110 A14,14 0 0 1 38,96 Z" />
  <path fill="#4CAF50" d="M27,96 H601 A3,3 0 0 1 604,99 V100 A3,3 0 0 1 601,103 H27 A3,3 0 0 1 24,100 V99 A3,3 0 0 1 27,96 Z" />
  <text x="44" y="118" font-family="Pretendard, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2E7D32">A. 소비전력 추정</text>
  <text x="44" y="140" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">강의실 1개: 조명(80W) + 에어컨(1,500W) = <tspan font-weight="700" fill="#2E7D32">1,580W</tspan></text>
  <text x="44" y="160" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">하루 낭비 시간: 3시간 → 1개 강의실 하루: 1.58 kW × 3h = <tspan font-weight="700" fill="#2E7D32">4.74 kWh</tspan></text>
  <text x="44" y="180" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">100개 강의실 × 4.74 = <tspan font-weight="700" fill="#2E7D32">474 kWh/일</tspan> → 월 22일 기준: <tspan font-weight="700" fill="#2E7D32">10,428 kWh/월</tspan></text>
  <text x="44" y="216" font-family="Pretendard, system-ui, sans-serif" font-size="12" fill="#9AA0A6">※ 실제 EcoReport 절감 가정: 제보 커버리지 30% → 절감 효율 30% 적용</text>

  
  <path fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" d="M38,242 H590 A14,14 0 0 1 604,256 V348 A14,14 0 0 1 590,362 H38 A14,14 0 0 1 24,348 V256 A14,14 0 0 1 38,242 Z" />
  <path fill="#4285F4" d="M27,242 H601 A3,3 0 0 1 604,245 V246 A3,3 0 0 1 601,249 H27 A3,3 0 0 1 24,246 V245 A3,3 0 0 1 27,242 Z" />
  <text x="44" y="264" font-family="Pretendard, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1565C0">B. 실질 월 전기 절감량</text>
  <text x="44" y="286" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">10,428 kWh × 30% 커버율 ≈ <tspan font-weight="700" fill="#1565C0">3,128 kWh/월 절감 가능</tspan></text>
  <text x="44" y="306" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">보수적 가정(100개 중 절감 성공 50개): <tspan font-weight="700" fill="#1565C0">600~1,000 kWh/월</tspan></text>
  <text x="44" y="326" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">전기료: 130원/kWh × 800 kWh = <tspan font-weight="700" fill="#1565C0">월 10.4만원 절약</tspan></text>
  <text x="44" y="346" font-family="Pretendard, system-ui, sans-serif" font-size="12" fill="#9AA0A6">연간: 124만원 절약 (100개 강의실 단 하나의 캠퍼스 기준)</text>

  
  <path fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.5" d="M38,378 H590 A14,14 0 0 1 604,392 V484 A14,14 0 0 1 590,498 H38 A14,14 0 0 1 24,484 V392 A14,14 0 0 1 38,378 Z" />
  <path fill="#2E7D32" d="M27,378 H601 A3,3 0 0 1 604,381 V382 A3,3 0 0 1 601,385 H27 A3,3 0 0 1 24,382 V381 A3,3 0 0 1 27,378 Z" />
  <text x="44" y="400" font-family="Pretendard, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2E7D32">C. CO₂ 절감 계산</text>
  <text x="44" y="422" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">한국 전력 탄소배출계수: <tspan font-weight="700">0.4586 kg CO₂/kWh</tspan> (2023년 기준)</text>
  <text x="44" y="442" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">월 800 kWh × 0.4586 = <tspan font-weight="700" fill="#2E7D32">약 367 kg CO₂/월</tspan></text>
  <text x="44" y="462" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">연간: <tspan font-weight="700" fill="#2E7D32">4,404 kg CO₂ ≈ 소나무 440그루 연간 흡수량</tspan></text>
  <text x="44" y="482" font-family="Pretendard, system-ui, sans-serif" font-size="12" fill="#9AA0A6">소나무 1그루 연간 약 10kg CO₂ 흡수 (국립산림과학원)</text>

  
  <path fill="#1A237E" d="M38,514 H590 A14,14 0 0 1 604,528 V590 A14,14 0 0 1 590,604 H38 A14,14 0 0 1 24,590 V528 A14,14 0 0 1 38,514 Z" />
  <text x="314" y="540" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">전국 430개 대학으로 확장 시</text>
  <text x="314" y="562" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="18" font-weight="800" fill="#4CAF50">연간 약 18,935 tCO₂ 절감 가능</text>
  <text x="314" y="584" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#9AA0A6">= 소나무 189만 그루 심는 효과 · 전국 대학 연간 전기료 1,000억+ 절감</text>

  
  <path fill="#FFFFFF" stroke="#E8EAED" stroke-width="1.5" d="M644,96 H1240 A16,16 0 0 1 1256,112 V588 A16,16 0 0 1 1240,604 H644 A16,16 0 0 1 628,588 V112 A16,16 0 0 1 644,96 Z" />
  <path fill="#2E7D32" d="M632,96 H1252 A4,4 0 0 1 1256,100 V100 A4,4 0 0 1 1252,104 H632 A4,4 0 0 1 628,100 V100 A4,4 0 0 1 632,96 Z" />
  <text x="942" y="120" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="16" font-weight="700" fill="#2E7D32">임팩트 비교</text>

  
  <text x="648" y="148" font-family="Pretendard, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1A237E">EcoReport 연간 탄소 절감 = 소나무 몇 그루?</text>

  
  <text x="648" y="178" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">1개 캠퍼스 (100개 강의실)</text>
  
  <path fill="#E8F5E9" d="M656,188 H1230 A8,8 0 0 1 1238,196 V232 A8,8 0 0 1 1230,240 H656 A8,8 0 0 1 648,232 V196 A8,8 0 0 1 656,188 Z" />
  <text x="660" y="220" font-family="Pretendard, system-ui, sans-serif" font-size="32" fill="#4CAF50">🌲🌲🌲🌲🌲 × 88 = 440그루</text>

  <text x="648" y="268" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">10개 캠퍼스 확장 시</text>
  <path fill="#E8F5E9" d="M656,278 H1230 A8,8 0 0 1 1238,286 V322 A8,8 0 0 1 1230,330 H656 A8,8 0 0 1 648,322 V286 A8,8 0 0 1 656,278 Z" />
  <text x="660" y="310" font-family="Pretendard, system-ui, sans-serif" font-size="32" fill="#2E7D32">🌲🌲🌲🌲🌲 × 880 = 4,400그루</text>

  <text x="648" y="358" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#5F6368">전국 430개 대학 전면 도입 시</text>
  <path fill="#C8E6C9" d="M656,368 H1230 A8,8 0 0 1 1238,376 V412 A8,8 0 0 1 1230,420 H656 A8,8 0 0 1 648,412 V376 A8,8 0 0 1 656,368 Z" />
  <text x="660" y="400" font-family="Pretendard, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1B5E20">🌳🌳🌳🌳🌳 × 37만 = 189만 그루!</text>

  
  <line x1="648" y1="434" x2="1236" y2="434" stroke="#E8EAED" stroke-width="1" />
  <text x="648" y="456" font-family="Pretendard, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A237E">에너지 절감 규모 비교</text>

  <path fill="#E8F5E9" d="M658,466 H818 A10,10 0 0 1 828,476 V546 A10,10 0 0 1 818,556 H658 A10,10 0 0 1 648,546 V476 A10,10 0 0 1 658,466 Z" />
  <text x="738" y="490" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">가정용 전기</text>
  <text x="738" y="510" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="22" font-weight="700" fill="#2E7D32">2.7가구</text>
  <text x="738" y="532" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">월 평균 300kWh 기준</text>
  <text x="738" y="548" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">1개 캠퍼스 월 절감</text>

  <path fill="#E3F2FD" d="M854,466 H1014 A10,10 0 0 1 1024,476 V546 A10,10 0 0 1 1014,556 H854 A10,10 0 0 1 844,546 V476 A10,10 0 0 1 854,466 Z" />
  <text x="934" y="490" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">EV 충전</text>
  <text x="934" y="510" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1565C0">12대분</text>
  <text x="934" y="532" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">65kWh/대 기준</text>
  <text x="934" y="548" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">완충 가능 대수</text>

  <path fill="#FFF8E1" d="M1050,466 H1226 A10,10 0 0 1 1236,476 V546 A10,10 0 0 1 1226,556 H1050 A10,10 0 0 1 1040,546 V476 A10,10 0 0 1 1050,466 Z" />
  <text x="1138" y="490" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">탄소 크레딧</text>
  <text x="1138" y="510" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="22" font-weight="700" fill="#E65100">약 2만원</text>
  <text x="1138" y="532" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">월 367kg CO₂</text>
  <text x="1138" y="548" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="11" fill="#9AA0A6">거래소 가격 기준</text>

  
  <path fill="#2E7D32" d="M36,620 H1244 A12,12 0 0 1 1256,632 V672 A12,12 0 0 1 1244,684 H36 A12,12 0 0 1 24,672 V632 A12,12 0 0 1 36,620 Z" />
  
