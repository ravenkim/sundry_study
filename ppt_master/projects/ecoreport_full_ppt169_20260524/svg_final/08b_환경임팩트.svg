  <text x="88" y="648" font-family="Pretendard, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">스마트폰 한 대가 만드는 변화 — 학생 1명 연간 제보 100회 = 소나무 4.4그루</text>
  <text x="88" y="670" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#A5D6A7">설비 투자 없이 · 앱 하나로 · 전국 학생이 함께 만드는 탄소중립 캠퍼스</text>

  <text x="1240" y="706" text-anchor="end" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#9AA0A6">08b / 30</text>
