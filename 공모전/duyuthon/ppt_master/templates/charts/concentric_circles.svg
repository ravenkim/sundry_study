<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!--
    동심원/불스아이 템플릿
    사용: 계층적 초점、영향/우선순위 원 레이어、핵심-주변 장치 디스플레이
    적용 가능한 시나리오: 목표 초점 분석、이해관계자 서클、핵심-확장하다-생태학
    지원하다: 4레이어 동심원 (추천하다3-5층)
    -->

    <defs>
        <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="2" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="1280" height="720" fill="#FFFFFF"/>

    <!-- 제목 -->
    <text x="60" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="30" font-weight="700" fill="#1A252F">제품 전략 우선순위 서클</text>
    <text x="60" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" fill="#7F8C8D">Concentric Model · 코어에서 주변부까지 네 가지 초점 레이어</text>

    <!-- 동심원 (왼쪽으로, 원의 중심 450,395) -->
    <!-- 아니요.4층 (가장 바깥쪽, 생태학) -->
    <circle cx="450" cy="395" r="290" fill="#0984E3" fill-opacity="0.06" stroke="#0984E3" stroke-width="1.5" stroke-opacity="0.2"/>
    <text x="450" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="600" fill="#0984E3" fill-opacity="0.6">생태학적 확장 Ecosystem</text>

    <!-- 아니요.3층 (확장하다) -->
    <circle cx="450" cy="395" r="210" fill="#00B894" fill-opacity="0.08" stroke="#00B894" stroke-width="1.5" stroke-opacity="0.25"/>
    <text x="450" y="208" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="600" fill="#00B894" fill-opacity="0.7">성장 엔진 Growth</text>

    <!-- 아니요.2층 (핵심 주변부) -->
    <circle cx="450" cy="395" r="135" fill="#FDCB6E" fill-opacity="0.1" stroke="#FDCB6E" stroke-width="2" stroke-opacity="0.3"/>
    <text x="450" y="282" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="600" fill="#D4A537" fill-opacity="0.8">핵심 지원 Core Support</text>

    <!-- 아니요.1층 (핵심, 가장 깊은 속의) -->
    <circle cx="450" cy="395" r="65" fill="#6C5CE7" filter="url(#ringGlow)"/>
    <text x="450" y="388" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="17" font-weight="800" fill="#FFFFFF">핵심</text>
    <text x="450" y="410" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="17" font-weight="800" fill="#FFFFFF">제품</text>

    <!-- 오른쪽 도움말 패널 -->
    <!-- 계층1 -->
    <g filter="url(#cardShadow)">
        <rect x="800" y="115" width="420" height="100" rx="10" fill="#FFFFFF"/>
        <rect x="800" y="115" width="6" height="100" rx="3" fill="#6C5CE7"/>
        <circle cx="830" cy="145" r="14" fill="#6C5CE7"/>
        <text x="830" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" font-weight="700" fill="#FFFFFF">1</text>
        <text x="856" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="16" font-weight="700" fill="#1A252F">핵심 제품 · 가장 높은 순위</text>
        <text x="830" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" fill="#5F6368">사용자 핵심 경험 기능，유지 및 유료 전환에 대한 직접적인 영향</text>
        <text x="830" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" fill="#95A5A6">투자하다60%의지 · 격주 반복</text>
    </g>

    <!-- 계층2 -->
    <g filter="url(#cardShadow)">
        <rect x="800" y="235" width="420" height="100" rx="10" fill="#FFFFFF"/>
        <rect x="800" y="235" width="6" height="100" rx="3" fill="#D4A537"/>
        <circle cx="830" cy="265" r="14" fill="#D4A537"/>
        <text x="830" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" font-weight="700" fill="#FFFFFF">2</text>
        <text x="856" y="269" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="16" font-weight="700" fill="#1A252F">핵심 지원 · 높은 순위</text>
        <text x="830" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" fill="#5F6368">성능 최적화、보안 규정 준수、기본 플랫폼 기능</text>
        <text x="830" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" fill="#95A5A6">투자하다25%의지 · 월간 반복</text>
    </g>

    <!-- 계층3 -->
    <g filter="url(#cardShadow)">
        <rect x="800" y="355" width="420" height="100" rx="10" fill="#FFFFFF"/>
        <rect x="800" y="355" width="6" height="100" rx="3" fill="#00B894"/>
        <circle cx="830" cy="385" r="14" fill="#00B894"/>
        <text x="830" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" font-weight="700" fill="#FFFFFF">3</text>
        <text x="856" y="389" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="16" font-weight="700" fill="#1A252F">성장 엔진 · 중간 우선순위</text>
        <text x="830" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" fill="#5F6368">고객 확보 채널 구축、운영 도구、사업화 역량</text>
        <text x="830" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" fill="#95A5A6">투자하다10%의지 · 분기별 계획</text>
    </g>

    <!-- 계층4 -->
    <g filter="url(#cardShadow)">
        <rect x="800" y="475" width="420" height="100" rx="10" fill="#FFFFFF"/>
        <rect x="800" y="475" width="6" height="100" rx="3" fill="#0984E3"/>
        <circle cx="830" cy="505" r="14" fill="#0984E3"/>
        <text x="830" y="510" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" font-weight="700" fill="#FFFFFF">4</text>
        <text x="856" y="509" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="16" font-weight="700" fill="#1A252F">생태학적 확장 · 우선순위 살펴보기</text>
        <text x="830" y="535" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" fill="#5F6368">오픈 플랫폼、ISV맞잡다、산업 솔루션</text>
        <text x="830" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" fill="#95A5A6">투자하다5%의지 · 반기 검토</text>
    </g>

    <!-- 하단 음표 -->
    <text x="640" y="690" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#BDC3C7">원의 중앙에 가까울수록 우선순위가 높아집니다.，더 많은 자원을 투자할수록</text>
</svg>