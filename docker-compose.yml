# FE + BE + MySQL 통합 실행
# 사용: cp .env.example .env 후 값 설정 → bash deploy.sh
# 비밀값은 .env 에만 두세요 (Git 추적 금지).

services:
  mysql:
    image: mysql:8.4
    container_name: ecoreport-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/energy_schema.sql:/docker-entrypoint-initdb.d/01-energy_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  be:
    build:
      context: ./be
      args:
        DEPS_IMAGE: ${DEPS_IMAGE:-ecoreport-be-deps:local}
    container_name: ecoreport-be
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy

  fe:
    build:
      context: ./fe
      args:
        DEPS_IMAGE: ${DEPS_IMAGE:-ecoreport-fe-deps:local}
        VITE_API_HOST: ${VITE_API_HOST:-}
    container_name: ecoreport-fe
    ports:
      - "8081:80"
    depends_on:
      - be

volumes:
  mysql_data:
