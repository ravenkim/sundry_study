# FE + BE 통합 실행 (MySQL은 서버 기존 설치본 사용)
# 사용: docker compose up --build

services:
  be:
    build: ./be
    container_name: ecoreport-be
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/DBname?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: your_mysql_user
      SPRING_DATASOURCE_PASSWORD: your_mysql_user

  fe:
    build:
      context: ./fe
    container_name: ecoreport-fe
    ports:
      - "8081:80"
    depends_on:
      - be
