# FE + BE + MySQL 통합 실행
# 사용: bash deploy.sh

services:
  mysql:
    image: mysql:8.4
    container_name: ecoreport-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: DBname
      MYSQL_USER: your_mysql_user
      MYSQL_PASSWORD: your_mysql_user
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  be:
    build: ./be
    container_name: ecoreport-be
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/DBname?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: your_mysql_user
      SPRING_DATASOURCE_PASSWORD: your_mysql_user
      FRONTEND_URL: http://localhost:8081
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret-at-least-32-chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      mysql:
        condition: service_healthy

  fe:
    build:
      context: ./fe
      args:
        # fe/deploy.sh가 해시 태그 이미지를 넘김. 직접 빌드 시 deps 이미지를 먼저 만들 것.
        DEPS_IMAGE: ${DEPS_IMAGE:-ecoreport-fe-deps:local}
    container_name: ecoreport-fe
    ports:
      - "8081:80"
    depends_on:
      - be

volumes:
  mysql_data:
