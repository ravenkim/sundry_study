spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/DBname?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: your_mysql_user
    password: your_mysql_user
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

management:
  info:
    git:
      mode: full
    env:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, metrics, info
info:
  app:
    name: Backend Weather API
    version: 1.0.0
    description: A RESTful API for Something
  build:
    artifact: @project.artifactId@
    name: @project.name@
    description: @project.description@
    version: @project.version@
    properties:
      java:
        version: @java.version@